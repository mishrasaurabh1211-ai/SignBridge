[project]
name = "signbridge"
version = "0.1.0"
description = "Real-time, bidirectional ASL<->English translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "onnxruntime",
    "tqdm",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]

[tool.setuptools]
packages = ["signbridge"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
strict = true
packages = ["signbridge"]

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "pyarrow.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "pandas.*",
    "tqdm.*"
]
ignore_missing_imports = true
